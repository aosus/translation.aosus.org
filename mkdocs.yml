site_name: ترجمة أسس
site_url: https://translation.aosus.org
repo_name: aosus/translation.aosus.org
repo_url: https://github.com/aosus/translation.aosus.org
site_description: صفحة مخصصة لجهود البرمجة في مجتمع أسس.
docs_dir: source

plugins:
  - autolinks
  - search
  - glightbox
  - git-revision-date-localized:
      type: timeago
  - minify:
      minify_html: true

theme: 
  name: material
  custom_dir: overrides
  logo: https://aosus.org/wp-content/uploads/2021/09/aosus-w-lwogores.png
  icon:
    repo: fontawesome/brands/github
  font: false
  language: ar
  features:
    - search.suggest 
    - search.highlight
    - content.tabs.link
    - navigation.instant
    - navigation.tracking
    - toc.integrate
  palette:
  # Palette toggle for light mode
  - media: "(prefers-color-scheme: light)"
    scheme: default
    toggle:
      icon: material/brightness-7
      name: بدِّل إلى الوضع الداكن
    primary: green
    accent: blue

  # Palette toggle for dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    toggle:
      icon: material/brightness-4
      name: بدِّل إلى الوضع الفاتح
    primary: green
    accent: blue


extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aosus
    - icon: fontawesome/brands/x-twitter
      link: https://twitter.com/aosusdotorg
    - icon: fontawesome/brands/mastodon
      link: https://mastodon.online/@aosus
    - icon: fontawesome/brands/bluesky
      link: https://bsky.app/profile/aosus.org
    - icon: fontawesome/brands/telegram
      link: https://t.me/aosus
    - icon: matrix
      link: https://matrix.to/#/#aosus:aosus.org
    - icon: fontawesome/brands/discord
      link: https://discord.com/invite/YJUzEhU955
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/aosus/

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption

extra_css:
  - extra.css

nav:
  - الرئيسية: index.md

  - البوابة العامة للتوطين:
      - مقدمة: localization/index.md
      - العولمة: localization/i18n.md
      - التوطين: localization/l10n.md

  - بوابة المشاريع:
      - مقدمة: projects/index.md
      - مشروع جنوم «GNOME»:
          - مقدمة: projects/gnome/index.md
          - دليل الأسلوب: projects/gnome/guidelines.md
